<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-tara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f6f7f9;
--bg2:#eef1f4;
--card:#ffffff;
--text:#14161a;
--muted:#6b7280;
--line:#e5e7eb;
--red:#e30613;
--red2:#ff4d59;
--shadow:0 12px 40px rgba(17,24,39,.08);
--shadow-strong:0 24px 70px rgba(15,16,18,.14);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Inter,system-ui,-apple-system,sans-serif;
background:
radial-gradient(circle at top right, rgba(227,6,19,.08), transparent 22%),
linear-gradient(180deg,#fafbfc 0%, #eff2f5 100%);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
color:var(--text);
}

.card{
width:min(100%,780px);
background:var(--card);
border:1px solid var(--line);
border-radius:34px;
box-shadow:var(--shadow-strong);
text-align:center;
padding:48px 36px 40px;
}

.logo-wrap{
margin-bottom:22px;
}

.brand-mark{
width:220px;
height:220px;
object-fit:cover;
border-radius:36px;
display:block;
margin:0 auto;
}

.subtitle{
font-size:22px;
color:var(--muted);
margin-top:14px;
margin-bottom:26px;
}

.title{
font-size:36px;
font-weight:900;
letter-spacing:-0.02em;
margin-bottom:26px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
max-width:520px;
margin:0 auto;
}

.btn{
height:60px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:18px;
text-decoration:none;
transition:.15s;
}

.btn-ua{
background:linear-gradient(180deg,var(--red2),var(--red));
color:white;
box-shadow:0 12px 26px rgba(227,6,19,.25);
}

.btn-ru{
background:white;
border:1px solid var(--line);
color:#111;
box-shadow:var(--shadow);
}

.btn:hover{transform:translateY(-1px)}

.footer{
margin-top:30px;
font-size:13px;
color:#8b93a1;
}

@media (max-width:640px){
.card{padding:32px 18px 26px}
.brand-mark{width:160px;height:160px;border-radius:28px}
.title{font-size:30px}
.actions{grid-template-columns:1fr}
}
</style>
</head>
